name: noa
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch        
  - torchvision   
  - numpy=1.23
  - pandas
  - matplotlib
  - scikit-learn
  - cxx-compiler
  - make
  - cmake
  - pip

  - pip:
      - requests
      - huggingface-hub
      - pyyaml
      - transformers
      - accelerate
      - streamlit
      - llama-cpp-python
      - git+https://github.com/ggml-org/llama.cpp.git

      